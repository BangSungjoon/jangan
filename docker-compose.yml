version: '3.8'

services:
  # 1. Spring Boot 애플리케이션 서비스
  app:
    build: ./backend/jangan-backend
    container_name: jangan-backend
    restart: always
    env_file: ./.env
    depends_on:
      - db
      - redis # app은 redis와 db가 실행된 후에 시작

  # 2. MySQL 데이터베이스 서비스
  db:
    image: mysql:8.0
    container_name: jangan-db
    restart: always
    env_file: ./.env
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"

  # 3. Redis 서비스
  redis:
    image: redis:latest
    container_name: jangan-redis
    restart: always
    env_file: ./.env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
  
  # 4. 웹페이지
  web:
    build:
      context: ./web
      args:
        - VITE_MAPBOX_ACCESS_TOKEN=${VITE_MAPBOX_ACCESS_TOKEN}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_NODE_API_BASE_URL=${VITE_NODE_API_BASE_URL}
    container_name: jangan-web
    restart: always

  # 5. Nginx 리버스 프록시 서비스
  nginx:
    image: nginx:latest
    container_name: jangan-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - web

volumes:
  db-data: