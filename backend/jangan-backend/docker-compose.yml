version: '3.8'

services:
  # 1. Spring Boot 애플리케이션 서비스
  app:
    build: .
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MYSQL_URL=${MYSQL_URL}
      - MYSQL_USERNAME=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - SPACES_ENDPOINT=${SPACES_ENDPOINT}
      - SPACES_ACCESS_KEY=${SPACES_ACCESS_KEY}
      - SPACES_SECRET_KEY=${SPACES_SECRET_KEY}
      - SPACES_IMAGELOG=${SPACES_IMAGELOG}
    depends_on:
      - db
      - redis # app은 redis와 db가 실행된 후에 시작

  # 2. MySQL 데이터베이스 서비스
  db:
    image: mysql:8.0
    container_name: jangan-db
    restart: always
    environment:
      - MYSQL_DATABASE=jangan_db
      - MYSQL_USER=jangan_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql

  # 3. Redis 서비스
  redis:
    image: redis:latest
    container_name: jangan-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}

  # 4. Nginx 리버스 프록시 서비스
  nginx:
    image: nginx:latest
    container_name: jangan-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

volumes:
  db-data: