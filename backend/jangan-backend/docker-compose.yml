version: '3.8'

services:
  app:
    build: . # 현재 폴더의 Dockerfile을 사용하여 이미지를 빌드
    container_name: jangan-backend
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod   # prod 프로필로 실행

      - REDIS_PASSWORD=${REDIS_PASSWORD}
      -
      - MYSQL_URL=${MYSQL_URL}
      - MYSQL_USERNAME=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      -
      - SPACES_ENDPOINT=${SPACES_ENDPOINT}
      - SPACES_ACCESS_KEY=${SPACES_ACCESS_KEY}
      - SPACES_SECRET_KEY=${SPACES_SECRET_KEY}
    depends_on:
      - db

  # MySQL 데이터베이스 서비스
  db:
    image: mysql:8.0
    container_name: jangan-db
    restart: always
    environment:
      - MYSQL_DATABASE=jangan_db
      - MYSQL_USER=jangan_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql # 데이터를 영구적으로 저장하기 위한 볼륨

  # Redis 서비스
  redis:
    image: redis:latest
    container_name: jangan-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} # 비밀번호 설정
    depends_on:
      - redis

  # Nginx 리버스 프록시 서비스
  nginx:
    image: nginx:latest
    container_name: jangan-nginx
    restart: always
    ports:
      - "80:80" # 외부의 80번 포트를 Nginx 컨테이너의 80번 포트로 연결
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf # Nginx 설정 파일 연결
    depends_on:
      - app

volumes:
  db-data: