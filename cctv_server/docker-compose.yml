version: '3.8'
services:
  cctv_server:
    build: .
    container_name: cctv_server
    ports:
      - "3000:3000"
      - "10000:10000"  # 웹소켓 포트도 추가
    depends_on:
      - redis
    env_file:
      - ./.env
  redis:
    image: redis:latest
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"